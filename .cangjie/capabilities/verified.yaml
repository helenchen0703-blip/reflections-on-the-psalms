  importance: high
  importance_rationale: task-07 的直接来源；寓意解经最易被滥用，Lewis 的三类区分提供了可操作的判别工具，遗漏则无法防范附会。
  one_liner: '判定第二义——考察原义→考察新义→问背后是否有共同事物真相——同源可引申，巧合和附会不可。'
  intents:
  - 判定一段文本的"第二层含义"是否合理
