schema_version: 1
bundle_id: bundle.reflections-on-the-psalms
book:
  title: 《诗篇撷思》(Reflections on the Psalms)
  author: C.S. Lewis（路益师，曾珍珍译，雅歌出版社 1991 初版）
  source_pack: books/reflections-on-the-psalms
  baseline_tag: baseline-psalms-9skill-20261024
entry:
  name: reflections-on-the-psalms
  description: '当用户在以下领域寻求帮助时调用: 读诗篇/旧约时遇到抵触或困惑（咒诅诗篇的仇恨、赞美的谄媚感、自义的矛盾）、
    审判/公正的视角转换、义愤与恶毒的情绪边界、途径（仪式/律法/方法论）是否喧宾夺主、第二层含义是否合法（巧合/同源/附会）、
    被赋予权威文本的阅读姿态、自然观的神学定位。不适用于: 非宗教纯文学分析、急性心理危机（先求助专业人士）、
    具体教义/神学论争的裁判。Triggers: 诗篇/Psalms/咒诅/审判/赞美/途径喧宾夺主/第二层含义/被提昇/创造论/义愤 vs 恶毒'
  core_principles:
  - 诗篇必须当作诗歌读——对仗是翻译后仍不失的格律，不可当教义论文或预言清单逐字提取命题。
  - '面对令人反感的文本时三步走——不回避（承认情绪真实）、不背书（记载≠称许）、理解因果（恨从伤害来）。'
  - 视角转换比换立场更有效——审判有刑事（被告求赦免）和民事（原告求伸冤）两个互补视角。
  - 途径喧宾夺主是最大祸害——仪式/律法/方法论从手段滑向目的时，祝福变为祸害（Charles Williams）。
  - 赞美不是义务性谄媚，而是欣赏臻入高潮时的自然流露——不赞美的欣赏是不完全的。
  - 第二义须与原义背后的事物真相一体同源——巧合不可引申，同源可引申，附会当拒绝。
  out_of_scope:
  - 非宗教纯文学分析（用文学批评方法即可，不需"提昇"框架）
  - 急性心理危机或暴力环境中的安全建议（请寻求专业帮助）
  - 具体教义/神学论争的裁判（本 skill 提供方法论工具，不充当神学裁判所）
  - 对非信徒强制适用信仰前设（"提昇""创造论"等概念依赖信仰前提）
  stop_conditions:
  - 用户在真正的暴力/虐待环境中 → 停止套用方法论，建议专业求助或报警。
  - 文本不含令人反感内容且不涉及第二义/体裁判定 → 不需调用相关能力，直接回答即可。
  - 纯事实查询（书名/作者/出版年/章节）→ 用 overview 回答后即停，不展开方法论。
  - 用户根本不认同"有值得终极赞美的对象"或"创造者"概念 → 承认信仰前设限制，不强行推广框架。
router_entry:
  name: reflections-on-the-psalms
  description: '当用户询问《诗篇撷思》(Reflections on the Psalms) 这本书本身（书名/作者/章节/整书概览/术语），
    或涉及本书未独立成 Skill 的主题时调用: 诗篇中的死亡/Sheol 观、同流合污的避难所、麦基洗德预表、
    焦点凝聚法/连战结构等文学技巧、附录 Robert Alter 诗篇文学分析。以下意图优先使用同包独立 Skill:
    genre-adapted-reading（怎么读诗歌体裁）、imprecation-three-step（面对咒诅/反感文本）、
    praise-essence-reframe（赞美/敬拜的抵触感）、means-displacing-ends（途径喧宾夺主检测）。
    Triggers: 诗篇撷思/Reflections on the Psalms/路益师/C.S. Lewis/Sheol/麦基洗德/焦点凝聚法'
